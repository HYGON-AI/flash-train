name: PR tests (HCU)

on:
  pull_request_target:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
  DTK_PKG_URL: ${{ vars.RESOURCE_SERVER_URL }}/dtk-pkg/dtk26.04/DTK-26.04-rc4-centos8-x86_64.tar.gz
  PYPI_URL: ${{ vars.PYPI_URL }}
  MAX_JOBS: "32"

concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  wheel:
    # The self-hosted runners and repo variables are configured on the public
    # repository only; PRs live there, so everywhere else this skips.
    if: github.repository == 'HYGON-AI/flash-train'
    name: Build wheel (Torch ${{ matrix.torch_version }})
    runs-on: [self-hosted]
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # The C++ tests are torch-independent; only one leg builds and runs
        # them alongside the wheel.
        include:
          - torch_version: "2.10.0"
            cpp_tests: true
          - torch_version: "2.11.0"
            cpp_tests: false
    env:
      TORCH_VERSION: ${{ matrix.torch_version }}
    container:
      image: ${{ vars.BASE_COMPILE_IMAGE_ROCKY_PY310 }}
      options: >-
        --device=/dev/kfd
        --device=/dev/dri/
        --group-add video
        -v /opt/hyhal/:/opt/hyhal/:ro
        --shm-size=80G
        --cap-add=SYS_PTRACE
        --security-opt seccomp=unconfined
        --privileged=true

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Configure internal Python index
        run: |
          if [[ -z "$PYPI_URL" ]]; then
            echo "PYPI_URL must be configured."
            exit 1
          fi
          PYPI_URL="${PYPI_URL%/}"
          python3 -m pip config set \
            global.index-url \
            "${PYPI_URL}/nightly/dtk2604/+simple/"

      - name: Install DTK
        run: |
          if [[ -z "$RESOURCE_SERVER_URL" ]]; then
            echo "RESOURCE_SERVER_URL must be configured."
            exit 1
          fi
          cd /opt
          wget -q "$DTK_PKG_URL"
          tar -xzf "$(basename "$DTK_PKG_URL")"
          mv dtk-* dtk

      - name: Install AICC
        run: |
          cd /tmp
          wget -q "${RESOURCE_SERVER_URL%/}/ai_cc/Nightly/hcu_llvm_installer.sh"
          bash hcu_llvm_installer.sh --major 1.0.0

      - name: Install wheel build dependencies
        run: >-
          python3 -m pip install --no-cache-dir
          numpy==1.26.4
          torch=="${TORCH_VERSION}"
          ninja
          wheel
          setuptools
          pybind11

      - name: Build wheel
        env:
          CPP_TESTS: ${{ matrix.cpp_tests }}
        run: |
          source /opt/dtk/env.sh
          export CMAKE_ARGS="-Dpybind11_DIR=$(python3 -m pybind11 --cmakedir)"
          extra=""
          if [[ "$CPP_TESTS" == "true" ]]; then
            extra="--config-settings=cmake.define.FTRAIN_BUILD_TESTS=ON"
          fi
          python3 -m pip wheel . --no-deps -w dist $extra

      - name: C++ tests
        if: ${{ matrix.cpp_tests }}
        run: |
          source /opt/dtk/env.sh
          mkdir -p "${GITHUB_WORKSPACE}/build/test-results"
          "${GITHUB_WORKSPACE}/build-wheel/bin/ftrain_test" --gtest_brief=1 --gtest_shuffle \
              --gtest_output=xml:"${GITHUB_WORKSPACE}/build/test-results/cpp_tests.xml"

      - name: Upload C++ test results
        if: ${{ matrix.cpp_tests && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-test-results-${{ matrix.torch_version }}
          path: build/test-results/cpp_tests.xml

      - name: Report C++ tests
        if: ${{ matrix.cpp_tests && !cancelled() }}
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: build/test-results/cpp_tests.xml
          require_tests: true
          fail_on_failure: true

      - name: Install pytest and the built wheel
        run: |
          source /opt/dtk/env.sh
          python3 -m pip install --no-cache-dir pytest
          python3 -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Python tests
        run: |
          source /opt/dtk/env.sh
          mkdir -p "${GITHUB_WORKSPACE}/build/test-results"
          cd /tmp
          python3 -m pytest "${GITHUB_WORKSPACE}/tests/python" \
              --junitxml="${GITHUB_WORKSPACE}/build/test-results/python_tests.xml"

      - name: Upload Python test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-results-${{ matrix.torch_version }}
          path: build/test-results/python_tests.xml

      - name: Report Python tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: build/test-results/python_tests.xml
          require_tests: true
          fail_on_failure: true

      - name: Clean workspace
        if: always()
        run: rm -rf "${GITHUB_WORKSPACE:?}"/* "${GITHUB_WORKSPACE:?}"/.[!.]* || true

