[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "flash-train"
dynamic = ["version"]
description = "flash-train PyTorch bindings"
requires-python = ">=3.10"

[tool.scikit-build]
build-dir = "build-wheel"
cmake.args = [
  "-DFTRAIN_PLATFORM_HYGON_HIP=ON",
  "-DFTRAIN_BUILD_TORCH_EXTENSION=ON",
  "-Damd_comgr_DIR=/opt/dtk/dcc/comgr/lib64/cmake/amd_comgr",
  "-DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=amd_comgr_DIR",
]
wheel.packages = ["python/flash_train"]
# The binding's C++ sources live under the package for cohesion
# (flash_train/torch/csrc); keep them out of the shipped wheel.
wheel.exclude = ["flash_train/torch/csrc/*"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION.txt"
regex = "^(?P<value>\\S+)"
