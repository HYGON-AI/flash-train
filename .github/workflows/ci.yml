name: flash-train CI
on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: flash-train-ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  build2604:
    name: DTK2604 (py${{ matrix.py_version }}, torch2.11.0)
    strategy:
      fail-fast: false
      matrix:
        include:
        - py_version: '3.10'
          numpy_version: '1.24.3'
          cpp_tests: false
        - py_version: '3.12'
          numpy_version: '1.26.4'
          cpp_tests: true
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.04'
      dtk_ver: '2604'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: ${{ matrix.py_version }}
      numpy_version: ${{ matrix.numpy_version }}
      torch_version: '2.11.0'
      cpp_tests: ${{ matrix.cpp_tests }}
      run_tests: ${{ github.event_name != 'push' }}
  build2610:
    name: DTK2610 (torch${{ matrix.torch_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch_version: '2.11.0'
            cpp_tests: true
          - torch_version: '2.13.0'
            cpp_tests: false
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: ${{ matrix.torch_version }}
      cpp_tests: ${{ matrix.cpp_tests }}
      run_tests: ${{ github.event_name != 'push' }}
  publish-2604:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'HYGON-AI/flash-train' }}
    needs: [build2604]
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_ver: '2604'
      dtk_version: '26.04'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  publish-2610:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'HYGON-AI/flash-train' }}
    needs: [build2610]
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_ver: '2610'
      dtk_version: '26.10'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  ci-result:
    if: ${{ always() }}
    needs: [build2604, build2610]
    runs-on: hygon-cpu
    env:
      BUILD_2604: ${{ needs.build2604.result }}
      BUILD_2610: ${{ needs.build2610.result }}
    steps:
      - name: Require completed CI jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_2604" = success
          test "$BUILD_2610" = success
