name: flash-train CI
on:
  pull_request_target:
    branches: [develop, zhipu]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [develop]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: >-
    flash-train-ci-${{ (github.event_name == 'workflow_dispatch' ||
      (github.event.label && (github.event.label.name != 'ok-to-test' ||
        github.event.pull_request.head.repo.full_name == github.repository))) &&
      github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
jobs:
  authorize-ci:
    if: >-
      ${{ !github.event.label ||
        (github.event.action == 'labeled' && github.event.label.name == 'ok-to-test' &&
          github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.approval.outputs.decision }}
    permissions:
      pull-requests: read
      issues: read
    steps:
    - name: Determine whether internal CI can run
      id: approval
      env:
        REQUIRES_APPROVAL: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository }}
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        if [[ "$REQUIRES_APPROVAL" == false ]]; then
          echo "decision=approved" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        repo="repos/$GITHUB_REPOSITORY"
        pr=$(gh api "$repo/pulls/$PR_NUMBER" --jq '[.state, .head.sha, any(.labels[]; .name == "ok-to-test")] | @tsv')
        IFS=$'\t' read -r state head_sha has_approval <<< "$pr"
        if [[ "$state" != open || "$head_sha" != "$EXPECTED_SHA" ]]; then
          echo "::error::The fork PR is closed or its head changed since this event."
          exit 1
        fi
        if [[ "$has_approval" != true ]]; then
          echo "::notice::Internal CI is waiting for a repository collaborator to add ok-to-test."
          echo 'Internal CI is waiting for a repository collaborator to add `ok-to-test`.' >> "$GITHUB_STEP_SUMMARY"
          echo "decision=pending" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # The push actor can differ from the collaborator who applied the active label.
        last_event=$(gh api --paginate "$repo/issues/$PR_NUMBER/events?per_page=100" --jq '
          .[] | select((.event == "labeled" or .event == "unlabeled") and .label.name == "ok-to-test")
          | [.event, .actor.login] | @tsv' | tail -n 1)
        IFS=$'\t' read -r action approver <<< "$last_event"
        if [[ "$action" != labeled || -z "$approver" ]]; then
          echo "::error::Could not verify who applied the active ok-to-test label."
          exit 1
        fi
        can_triage=$(gh api "$repo/collaborators/$approver/permission" --jq '.user.permissions.triage == true')
        if [[ "$can_triage" != true ]]; then
          echo "::error::The person who added ok-to-test must have at least Triage access to $GITHUB_REPOSITORY."
          exit 1
        fi
        echo "Fork PR #$PR_NUMBER approved by repository collaborator $approver."
        echo "decision=approved" >> "$GITHUB_OUTPUT"
  build2610:
    if: ${{ needs.authorize-ci.outputs.decision == 'approved' && github.event.pull_request.base.ref != 'zhipu' }}
    needs: authorize-ci
    name: DTK2610 (torch${{ matrix.torch_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - torch_version: '2.11.0'
            cpp_tests: true
          - torch_version: '2.13.0'
            cpp_tests: false
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '26.10'
      dtk_ver: '2610'
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: ${{ matrix.torch_version }}
      cpp_tests: ${{ matrix.cpp_tests }}
      run_tests: ${{ github.event_name != 'push' }}
  build2704:
    if: >-
      ${{ needs.authorize-ci.outputs.decision == 'approved' &&
        github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'zhipu' }}
    needs: authorize-ci
    name: DTK2704 (py3.12, torch2.13.0)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '27.04'
      dtk_ver: '2704'
      source_sha: ${{ github.event.pull_request.head.sha }}
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: '2.13.0'
      cpp_tests: false
      run_tests: false
  publish-2610:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'HYGON-AI/flash-train' }}
    needs: [build2610]
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_ver: '2610'
      dtk_version: '26.10'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
  ci-result:
    name: >-
      ${{ needs.authorize-ci.outputs.decision == 'pending' && 'Waiting for ok-to-test' ||
        needs.authorize-ci.result == 'skipped' && 'Ignored label change' || 'ci-result' }}
    if: ${{ !cancelled() && needs.authorize-ci.result != 'skipped' && needs.authorize-ci.outputs.decision != 'pending' }}
    needs: [authorize-ci, build2610, build2704]
    runs-on: hygon-cpu
    env:
      BUILD_RESULT: ${{ github.event.pull_request.base.ref == 'zhipu' && needs.build2704.result || needs.build2610.result }}
    steps:
      - name: Require completed CI jobs
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
