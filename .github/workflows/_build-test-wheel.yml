name: Build and test wheel
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      dtk_version:
        required: true
        type: string
      dtk_ver:
        required: true
        type: string
      py_version:
        required: true
        type: string
      numpy_version:
        required: true
        type: string
      torch_version:
        required: true
        type: string
      cpp_tests:
        required: true
        type: boolean
      run_tests:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  build:
    runs-on: hygon-build
    timeout-minutes: 180
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version }}
    defaults:
      run:
        shell: bash
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      AICC_INSTALLER_URL: ${{ vars.AICC_INSTALLER_URL }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      MAX_JOBS: '32'
      PYTHONUNBUFFERED: '1'
      DTK_VER: ${{ inputs.dtk_ver }}
      PYTHON_VERSION: ${{ inputs.py_version }}
      NUMPY_VERSION: ${{ inputs.numpy_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      CPP_TESTS: ${{ inputs.cpp_tests }}
      CI_RUN_TESTS: ${{ inputs.run_tests }}
      PYTHON: python3
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify and integrate PR source
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        actual_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
        if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
          echo "::error::Expected source $EXPECTED_SOURCE_SHA but checked out $actual_sha."
          exit 1
        fi
        bash .github/scripts/checkout-source.sh
    - name: Capture source and base image for reproduction
      id: reproduce
      continue-on-error: true
      env:
        CI_CONTAINER_ID: ${{ job.container.id }}
        CI_CONTAINER_IMAGE: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version }}
      run: |
        export CI_REPRO_DIR="$RUNNER_TEMP/reproduce-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-dtk$DTK_VER-py$PYTHON_VERSION-torch$TORCH_VERSION"
        echo "CI_REPRO_DIR=$CI_REPRO_DIR" >> "$GITHUB_ENV"
        python3 .github/scripts/capture-ci-env.py initial
    - name: Install compiler and dependencies
      id: setup
      run: bash .github/scripts/setup-env.sh
    - name: Build and repair wheel
      id: build
      run: |
        source .github/scripts/common.sh

        args=()
        if [[ "$CPP_TESTS" == true && "${{ inputs.run_tests }}" == true ]]; then
          args+=(--build-tests)
        fi
        bash .github/scripts/_build_hcu_wheel.sh --out-dir "${CI_WORK_DIR}/dist" "${args[@]}"

        CIUpload REPAIR \
          --dtk_version "${DTK_VER}" \
          --torch_version "${TORCH_VERSION}" \
          --git_commit "$(git rev-parse --short=6 HEAD)" \
          --outputdir "${WHEEL_OUTPUT}" \
          -f "${CI_WORK_DIR}"/dist/*.whl
    - name: Finalize reproduction metadata
      if: ${{ always() && steps.reproduce.outcome == 'success' }}
      continue-on-error: true
      env:
        CI_SETUP_OUTCOME: ${{ steps.setup.outcome }}
        CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
      run: python3 .github/scripts/capture-ci-env.py final
    - name: Upload reproduction metadata
      if: ${{ always() && steps.reproduce.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: reproduce-info-${{ github.run_id }}-${{ github.run_attempt }}-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: ${{ env.CI_REPRO_DIR }}/
        if-no-files-found: warn
        retention-days: 30
    - name: Upload repaired wheel
      uses: actions/upload-artifact@v4
      with:
        name: wheel-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: output/
        if-no-files-found: error
        retention-days: 7
    - name: Archive C++ test executable
      if: ${{ inputs.run_tests && inputs.cpp_tests }}
      run: tar -C build-wheel/bin -czf "${RUNNER_TEMP}/ftrain_test.tar.gz" ftrain_test
    - name: Upload C++ test executable
      if: ${{ inputs.run_tests && inputs.cpp_tests }}
      uses: actions/upload-artifact@v4
      with:
        name: cpp-tests-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: ${{ runner.temp }}/ftrain_test.tar.gz
        if-no-files-found: error
        retention-days: 7
  test:
    if: ${{ inputs.run_tests }}
    needs: build
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ inputs.dtk_version }}-rockylinux8.6-py${{ inputs.py_version }}
    defaults:
      run:
        shell: bash
    env:
      PYPI_URL: ${{ vars.PYPI_URL }}
      AICC_INSTALLER_URL: ${{ vars.AICC_INSTALLER_URL }}
      RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}
      PYTHONUNBUFFERED: '1'
      DTK_VER: ${{ inputs.dtk_ver }}
      PYTHON_VERSION: ${{ inputs.py_version }}
      NUMPY_VERSION: ${{ inputs.numpy_version }}
      TORCH_VERSION: ${{ inputs.torch_version }}
      CPP_TESTS: ${{ inputs.cpp_tests }}
      PYTHON: python3
    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || inputs.source_sha }}
        fetch-depth: 0
        persist-credentials: false
    - name: Verify and integrate PR source
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        actual_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)
        if [[ "$actual_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
          echo "::error::Expected source $EXPECTED_SOURCE_SHA but checked out $actual_sha."
          exit 1
        fi
        bash .github/scripts/checkout-source.sh
    - name: Download repaired wheel
      uses: actions/download-artifact@v4
      with:
        name: wheel-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: output
    - name: Download C++ test executable
      if: ${{ inputs.cpp_tests }}
      uses: actions/download-artifact@v4
      with:
        name: cpp-tests-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: ${{ runner.temp }}
    - name: Restore C++ test executable
      if: ${{ inputs.cpp_tests }}
      run: |
        mkdir -p build-wheel/bin
        tar -C build-wheel/bin -xzf "${RUNNER_TEMP}/ftrain_test.tar.gz" ftrain_test
    - name: Install compiler and dependencies
      run: bash .github/scripts/setup-env.sh
    - name: Test installed wheel
      run: bash .github/scripts/test-wheel.sh
    - name: Upload test reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-dtk${{ inputs.dtk_ver }}-py${{ inputs.py_version }}-torch${{ inputs.torch_version }}
        path: output/**/*.xml
        if-no-files-found: warn
        retention-days: 7
