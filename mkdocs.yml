site_name: Flash Train
site_description: HCU 新算子首发库——高性能训练算子、参考实现与框架绑定
site_url: https://hygon-ai.github.io/flash-train/
repo_url: https://github.com/HYGON-AI/flash-train
repo_name: HYGON-AI/flash-train

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang:
        - zh
        - en

nav:
  - 首页: index.md
  # 基准页面由 docs-site workflow 从 benchmarks/results/ 渲染；页面已入库的算子在此登记导航条目。
  - 使用指南: usage.md
  - 架构: architecture.md
  - 开发指南: development.md
