name: flash-train zhipu CI
on:
  push:
    branches: [zhipu]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build2704:
    if: ${{ github.repository == 'HYGON-AI/flash-train' && github.ref == 'refs/heads/zhipu' }}
    name: DTK2704 (py3.12, torch2.13.0)
    uses: ./.github/workflows/_build-test-wheel.yml
    with:
      dtk_version: '27.04'
      dtk_ver: '2704'
      source_sha: ${{ github.sha }}
      py_version: '3.12'
      numpy_version: '1.26.4'
      torch_version: '2.13.0'
      cpp_tests: false
      run_tests: false
  publish-2704:
    if: ${{ github.event_name == 'push' }}
    needs: [build2704]
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/_publish.yml
    with:
      dtk_version: '27.04'
      dtk_ver: '2704'
    secrets:
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
