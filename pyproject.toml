[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "flash-train"
dynamic = ["version"]
description = "High-performance training operators with framework bindings"
requires-python = ">=3.10"

[tool.scikit-build]
build-dir = "build-wheel"
wheel.packages = ["python/flash_train"]
# Keep the binding sources under flash_train/torch/csrc out of the wheel.
wheel.exclude = ["flash_train/torch/csrc/*"]

[tool.scikit-build.cmake.define]
# Marks this configure as a wheel build for the install guard in the root
# CMakeLists (scikit-build-core 1.x injects no SKBUILD variable to test).
FTRAIN_BUILD_WHEEL = "ON"
FTRAIN_PLATFORM_HYGON_HIP = "ON"
FTRAIN_BUILD_TORCH_BINDINGS = "ON"
amd_comgr_DIR = "/opt/dtk/dcc/comgr/lib64/cmake/amd_comgr"
CMAKE_TRY_COMPILE_PLATFORM_VARIABLES = "amd_comgr_DIR"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "VERSION.txt"
regex = "^(?P<value>\\S+)"
